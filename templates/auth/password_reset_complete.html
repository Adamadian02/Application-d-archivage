<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe mis à jour — GED</title>
  {% load static %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card" style="max-width:420px;width:100%;">
    <div class="auth-header">
      <div class="auth-logo bg-success text-white"><i class="bi bi-check-circle-fill"></i></div>
      <div class="auth-title">Mot de passe mis à jour</div>
      <div class="auth-subtitle">Votre mot de passe a été modifié</div>
    </div>
    <div class="auth-body text-center">
      <p class="mb-4 text-muted">Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
      <a href="{% url 'connexion' %}" class="btn btn-primary w-100 btn-lg">Se connecter</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
